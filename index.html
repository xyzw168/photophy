<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✧ photophy ✧</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ffb3c6; 
            --light-pink: #ffe5ec;
            --blue: #bde0fe; 
            --green: #caffbf; 
            --yellow: #fdffb6; 
            --purple: #ffc8dd;
            --dark-text: #594a4e;
            --border-color: #594a4e;
        }

        body {
            background-color: #fce4ec;
            background-image: radial-gradient(var(--pink) 2px, transparent 2px);
            background-size: 20px 20px;
            font-family: 'Quicksand', sans-serif;
            color: var(--dark-text);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px; 
            margin: 0;
            overflow-x: hidden; 
            touch-action: manipulation; 
            min-height: 100vh;
        }

        #flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 999;
        }
        .flash-active { animation: flash-anim 0.3s ease-out; }
        @keyframes flash-anim { 0% { opacity: 1; } 100% { opacity: 0; } }

        .window {
            background: #ffffff; 
            border: 3px solid var(--border-color); 
            border-radius: 20px;
            box-shadow: 6px 6px 0px var(--border-color);
            width: 95%; max-width: 480px; margin-top: 10px;
            overflow: hidden;
        }

        .title-bar {
            background: linear-gradient(90deg, var(--purple), var(--pink));
            color: var(--dark-text); padding: 10px 15px; display: flex; justify-content: space-between;
            font-weight: 700; border-bottom: 3px solid var(--border-color); font-size: 15px;
            letter-spacing: 1px;
        }

        .content { padding: 15px; text-align: center; }

        .camera-section {
            display: flex; gap: 10px; align-items: flex-start; justify-content: center; margin-bottom: 15px;
        }

        #camera-box {
            position: relative; flex: 3; aspect-ratio: 4/3; 
            background: #000; border: 3px solid var(--border-color); 
            border-radius: 12px;
            overflow: hidden;
        }

        video, #adj-canvas { width: 100%; height: 100%; object-fit: cover; }
        #adj-canvas { display: none; position: absolute; top: 0; left: 0; touch-action: none; cursor: move; background: #222; }
        .mirror { transform: scaleX(-1); }

        #countdown {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 70px; color: white; font-weight: 700; z-index: 100;
            text-shadow: 3px 3px 0px var(--border-color); display: none;
            animation: bounce 0.4s infinite alternate;
        }
        @keyframes bounce { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.1); } }

        .side-preview {
            flex: 1; display: flex; flex-direction: column; align-items: center; 
            background: var(--light-pink); border: 2px solid var(--border-color); border-radius: 12px; padding: 8px; min-height: 120px;
        }

        #frame-mini-preview {
            width: 100%; height: 75px; border: 2px dashed var(--border-color); border-radius: 8px; background: white;
            display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 11px; font-weight: 700;
        }
        #frame-mini-preview img { width: 100%; height: 100%; object-fit: contain; }

        .label { font-size: 11px; font-weight: 700; margin: 12px 0 6px 0; text-transform: uppercase; color: var(--dark-text); }
        .selector-group { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
        
        .btn-option {
            padding: 6px 10px; border: 2px solid var(--border-color); background: white;
            border-radius: 8px; cursor: pointer; font-size: 10px; font-weight: 700; font-family: inherit;
            transition: all 0.1s ease;
        }
        .btn-option:hover { background: var(--light-pink); }
        .active { background: var(--pink) !important; color: white; transform: translateY(-2px); box-shadow: 2px 2px 0px var(--border-color); }

        .main-btn {
            width: 100%; padding: 12px; background: var(--green); border: 3px solid var(--border-color);
            border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 3px 3px 0px var(--border-color); 
            margin-top: 10px; font-family: inherit; color: var(--dark-text);
            transition: transform 0.1s ease;
        }
        .main-btn:active { transform: translateY(2px); box-shadow: 1px 1px 0px var(--border-color); }
        
        .switch-btn {
            padding: 6px; border: 2px solid var(--border-color); border-radius: 8px;
            font-size: 10px; font-weight: 700; cursor: pointer; margin-top: 6px; width: 100%; font-family: inherit;
        }

        #adjust-ui { display: none; background: var(--light-pink); padding: 12px; border: 2px dashed var(--border-color); border-radius: 12px; margin-top: 10px; }

        #gallery {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
            margin-top: 25px; width: 95%; max-width: 480px;
        }

        .polaroid {
            background: white; padding: 10px; border: 3px solid var(--border-color); border-radius: 12px;
            box-shadow: 4px 4px 0px var(--border-color);
            transform: rotate(var(--r)); margin-bottom: 15px;
        }
        .polaroid img { width: 100%; border: 2px solid var(--light-pink); border-radius: 6px; margin-bottom: 8px; display: block; }
        .pol-btns { display: flex; flex-direction: column; gap: 5px; }
        .pol-btns button { width: 100%; padding: 6px; font-size: 10px; cursor: pointer; border: 2px solid var(--border-color); border-radius: 6px; font-weight: 700; font-family: inherit; }

        footer { margin-top: 30px; margin-bottom: 20px; font-size: 12px; font-weight: 700; color: var(--dark-text); }
    </style>
</head>
<body>

    <div id="flash"></div>

    <div class="window">
        <div class="title-bar"><span>📸 ✧ photophy ✧</span><span>(✿◠‿◠)</span></div>
        <div class="content">
            <div class="camera-section">
                <div id="camera-box">
                    <div id="countdown">3</div>
                    <video id="video" autoplay playsinline class="mirror"></video>
                    <canvas id="adj-canvas"></canvas>
                </div>
                
                <div class="side-preview">
                    <div class="label" style="margin-top:0">Frame</div>
                    <div id="frame-mini-preview">None</div>
                    <button class="switch-btn" style="background:var(--yellow)" onclick="switchCamera()">🔄 SWAP</button>
                    <button class="switch-btn" style="background:var(--blue)" onclick="document.getElementById('file-in').click()">📁 LOAD</button>
                    <input type="file" id="file-in" hidden accept="image/*" onchange="handleUpload(event)">
                </div>
            </div>

            <div id="adjust-ui">
                <div class="label" id="slot-info">Zoom & Geser Foto (1/1)</div>
                <input type="range" id="zoom-range" min="0.1" max="2" step="0.01" value="1" style="width:100%; accent-color: var(--pink);">
                <button class="main-btn" style="background:var(--purple); margin-top:10px" onclick="confirmAdjustment()">✅ NEXT / DONE</button>
            </div>

            <div id="main-controls">
                <div class="label">1. Choose Layout</div>
                <div class="selector-group">
                    <!-- Ukuran Canvas diperjelas standard resolusi proporsional -->
                    <button class="btn-option active" onclick="selectLayout('SINGLE', 1, 600, 800, this)">SINGLE</button>
                    <button class="btn-option" onclick="selectLayout('STRIP', 3, 600, 1800, this)">STRIP (3)</button>
                    <button class="btn-option" onclick="selectLayout('GRID', 4, 800, 800, this)">GRID (4)</button>
                    <button class="btn-option" onclick="selectLayout('STORY3', 3, 1080, 1920, this)">STORY (3)</button>
                    <button class="btn-option" onclick="selectLayout('STORY4', 4, 1080, 1920, this)">STORY (4)</button>
                </div>

                <div class="label">2. Choose Design</div>
                <div id="frame-options" class="selector-group"></div>

                <div class="label">3. Filter</div>
                <div class="selector-group">
                    <button class="btn-option active" onclick="setFilter('none', this)">NORMAL</button>
                    <button class="btn-option" onclick="setFilter('vintage', this)">VINTAGE</button>
                    <button class="btn-option" onclick="setFilter('bw', this)">B&W</button>
                    <button class="btn-option" onclick="setFilter('rosy', this)">ROSY</button>
                    <button class="btn-option" onclick="setFilter('cold', this)">COLD</button>
                </div>

                <button id="snap" class="main-btn">✨ TAKE PHOTO ✨</button>
            </div>
        </div>
    </div>

    <div id="gallery"></div>
    <canvas id="canvas" style="display:none;"></canvas>

    <footer>made with 🩷 by @widiyauwilloveu ✧</footer>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const adjCanvas = document.getElementById('adj-canvas');
        const adjCtx = adjCanvas.getContext('2d');
        const gallery = document.getElementById('gallery');
        const countdownEl = document.getElementById('countdown');
        const snapBtn = document.getElementById('snap');
        const miniPreview = document.getElementById('frame-mini-preview');
        const frameOptions = document.getElementById('frame-options');
        const zoomRange = document.getElementById('zoom-range');

        let currentFilter = 'none';
        let currentLayout = { id: 'SINGLE', count: 1, w: 600, h: 800 };
        let selectedFrameURL = 'none';
        let useFacingMode = 'user';
        let capturedImgs = [];
        let tempImg = new Image();
        let offX = 0, offY = 0, scale = 1, isDragging = false, lastX, lastY;

        // Database frame dipetakan sesuai URL asli kamu (layphy1 untuk strip/single, layphy2 untuk grid)
        const frameDatabase = {
            'SINGLE': [{ name: 'NONE', url: 'none' }, { name: 'FRAME 1', url: 'https://i.ibb.co.com/fGzfpG5R/layphy1.png' }],
            'STRIP': [{ name: 'NONE', url: 'none' }, { name: 'STRIP A', url: 'https://i.ibb.co.com/fGzfpG5R/layphy1.png' }],
            'GRID': [{ name: 'NONE', url: 'none' }, { name: 'GRID A', url: 'https://i.ibb.co.com/Yn4fKQv/layphy2.png' }],
            'STORY3': [{ name: 'NONE', url: 'none' }, { name: 'IG 3A', url: 'https://i.ibb.co.com/fGzfpG5R/layphy1.png' }],
            'STORY4': [{ name: 'NONE', url: 'none' }, { name: 'IG 4A', url: 'https://i.ibb.co.com/Yn4fKQv/layphy2.png' }]
        };

        const filterStyles = {
            none: '',
            vintage: 'sepia(0.5) contrast(1.1) brightness(1.1)',
            bw: 'grayscale(1) contrast(1.2)',
            rosy: 'hue-rotate(-20deg) saturate(1.2) brightness(1.1)',
            cold: 'contrast(1.1) brightness(1.1) saturate(0.8) hue-rotate(180deg) opacity(0.9)'
        };

        async function startCamera() {
            if (video.srcObject) { video.srcObject.getTracks().forEach(track => track.stop()); }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: useFacingMode } });
                video.srcObject = stream;
            } catch (err) { alert("Akses kamera ditolak atau perangkat tidak mendukung."); }
        }

        function switchCamera() { 
            useFacingMode = useFacingMode === 'user' ? 'environment' : 'user'; 
            video.classList.toggle('mirror', useFacingMode === 'user'); 
            startCamera(); 
        }

        function selectLayout(id, count, w, h, el) {
            currentLayout = { id, count, w, h };
            capturedImgs = []; 
            updateActive(el, '.btn-option');
            renderFrameOptions(id);
            setFrame('none');
        }

        function renderFrameOptions(id) {
            frameOptions.innerHTML = '';
            frameDatabase[id].forEach(frame => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = frame.name;
                btn.onclick = () => { setFrame(frame.url); updateActive(btn, '.btn-option'); };
                frameOptions.appendChild(btn);
            });
        }

        function setFrame(url) {
            selectedFrameURL = url;
            miniPreview.innerHTML = url === 'none' ? 'None' : `<img src="${url}">`;
        }

        function setFilter(f, el) {
            currentFilter = f;
            video.style.filter = filterStyles[f];
            updateActive(el, '.btn-option');
        }

        function updateActive(el, selector) {
            el.parentElement.querySelectorAll(selector).forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        snapBtn.addEventListener('click', async () => {
            snapBtn.disabled = true;
            capturedImgs = [];
            for(let i = 0; i < currentLayout.count; i++) {
                await runCountdown(3);
                capturedImgs.push(grabFrame());
                showFlash();
                if(i < currentLayout.count - 1) await new Promise(r => setTimeout(r, 600));
            }
            renderFinal();
            snapBtn.disabled = false;
        });

        function runCountdown(sec) {
            return new Promise(res => {
                let count = sec;
                countdownEl.style.display = 'block'; 
                countdownEl.innerText = count;
                let timer = setInterval(() => {
                    count--;
                    if(count <= 0) { 
                        clearInterval(timer); 
                        countdownEl.style.display = 'none'; 
                        res(); 
                    } else { 
                        countdownEl.innerText = count; 
                    }
                }, 1000);
            });
        }

        function grabFrame() {
            const temp = document.createElement('canvas');
            let tw = 600, th = 450;
            temp.width = tw; temp.height = th;
            const tCtx = temp.getContext('2d');
            tCtx.filter = filterStyles[currentFilter];
            if (useFacingMode === 'user') { tCtx.translate(tw, 0); tCtx.scale(-1, 1); }
            const vw = video.videoWidth; const vh = video.videoHeight;
            const vRatio = vw / vh; const tRatio = tw / th;
            let sx, sy, sw, sh;
            if (vRatio > tRatio) { sw = vh * tRatio; sh = vh; sx = (vw - sw) / 2; sy = 0; }
            else { sw = vw; sh = vw / tRatio; sx = 0; sy = (vh - sh) / 2; }
            tCtx.drawImage(video, sx, sy, sw, sh, 0, 0, tw, th);
            return temp;
        }

        function handleUpload(e) {
            if (capturedImgs.length >= currentLayout.count) {
                alert("Slot sudah penuh! Selesaikan atau buat baru."); 
                return;
            }
            const reader = new FileReader();
            reader.onload = (f) => {
                tempImg = new Image();
                tempImg.onload = () => {
                    adjCanvas.width = 600; adjCanvas.height = 450;
                    adjCanvas.style.display = 'block';
                    document.getElementById('adjust-ui').style.display = 'block';
                    document.getElementById('main-controls').style.display = 'none';
                    document.getElementById('slot-info').innerText = `Zoom & Geser Foto (${capturedImgs.length + 1}/${currentLayout.count})`;
                    offX = 300; offY = 225; scale = 0.5;
                    drawAdj();
                };
                tempImg.src = f.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
            e.target.value = ''; 
        }

        function drawAdj() {
            adjCtx.fillStyle = '#000'; adjCtx.fillRect(0, 0, 600, 450);
            adjCtx.filter = filterStyles[currentFilter];
            const w = tempImg.width * scale, h = tempImg.height * scale;
            adjCtx.drawImage(tempImg, offX - w/2, offY - h/2, w, h);
        }

        adjCanvas.onpointerdown = e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; };
        window.onpointermove = e => { if(!isDragging) return; offX += e.clientX - lastX; offY += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; drawAdj(); };
        window.onpointerup = () => isDragging = false;
        zoomRange.oninput = e => { scale = e.target.value; drawAdj(); };

        function confirmAdjustment() {
            const c = document.createElement('canvas'); c.width = 600; c.height = 450;
            c.getContext('2d').drawImage(adjCanvas, 0, 0);
            capturedImgs.push(c);
            
            adjCanvas.style.display = 'none';
            document.getElementById('adjust-ui').style.display = 'none';
            document.getElementById('main-controls').style.display = 'block';
            
            if(capturedImgs.length >= currentLayout.count) {
                renderFinal();
            } else {
                alert(`Foto ${capturedImgs.length} tersimpan. Silakan jepret/load ${currentLayout.count - capturedImgs.length} lagi.`);
            }
        }

        // --- RENDER FINAL DENGAN KOORDINAT PRESISI UNTUK FRAME LAYPHY1 & LAYPHY2 ---
        async function renderFinal() {
            const ctx = canvas.getContext('2d');
            canvas.width = currentLayout.w; canvas.height = currentLayout.h;
            ctx.fillStyle = "white"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Logika tata letak posisi lubang foto disesuaikan agar pas di dalam bingkai template
            if (currentLayout.id === 'SINGLE') {
                ctx.drawImage(capturedImgs[0], 65, 65, 470, 380);
            } 
            else if (currentLayout.id === 'STRIP') {
                // Untuk strip 3 (menggunakan referensi layout template layphy1)
                // Disesuaikan koordinat Y agar pas di 3 kotak bingkai kayu
                ctx.drawImage(capturedImgs[0], 65, 80, 470, 370);
                ctx.drawImage(capturedImgs[1], 65, 520, 470, 370);
                ctx.drawImage(capturedImgs[2], 65, 960, 470, 370);
            }
            else if (currentLayout.id === 'GRID') {
                // Untuk grid 4 (menggunakan referensi layout template layphy2)
                ctx.drawImage(capturedImgs[0], 60, 60, 320, 320);
                ctx.drawImage(capturedImgs[1], 420, 60, 320, 320);
                ctx.drawImage(capturedImgs[2], 60, 420, 320, 320);
                ctx.drawImage(capturedImgs[3], 420, 420, 320, 320);
            }
            else if (currentLayout.id === 'STORY3') {
                for(let i=0; i<3; i++) ctx.drawImage(capturedImgs[i], 100, 200 + (i*520), 880, 480);
            }
            else if (currentLayout.id === 'STORY4') {
                ctx.drawImage(capturedImgs[0], 100, 200, 420, 560); ctx.drawImage(capturedImgs[1], 560, 200, 420, 560);
                ctx.drawImage(capturedImgs[2], 100, 850, 420, 560); ctx.drawImage(capturedImgs[3], 560, 850, 420, 560);
            }

            // Timpa gambar frame di atas foto agar lubang framenya pas menutupi pinggiran foto
            if (selectedFrameURL !== 'none') {
                const fImg = new Image(); fImg.crossOrigin = "anonymous"; fImg.src = selectedFrameURL;
                await new Promise(r => fImg.onload = r);
                ctx.drawImage(fImg, 0, 0, canvas.width, canvas.height);
            }

            const url = canvas.toDataURL('image/png');
            const div = document.createElement('div');
            div.className = 'polaroid'; div.style.setProperty('--r', (Math.random()*4-2)+'deg');
            div.innerHTML = `
                <img src="${url}">
                <div class="pol-btns">
                    <button style="background:var(--blue)" onclick="downloadImg('${url}')">💾 SAVE</button>
                    <button style="background:var(--pink); color:white" onclick="this.parentElement.parentElement.remove()">🗑️ DELETE</button>
                </div>
            `;
            gallery.prepend(div);
            capturedImgs = []; 
        }

        function showFlash() { 
            document.getElementById('flash').classList.add('flash-active'); 
            setTimeout(() => document.getElementById('flash').classList.remove('flash-active'), 300); 
        }
        function downloadImg(url) { 
            const a = document.createElement('a'); 
            a.href = url; 
            a.download = `photophy_${Date.now()}.png`; 
            a.click(); 
        }
        
        startCamera();
        renderFrameOptions('SINGLE');
    </script>
</body>
</html>
